# nginx.conf — AcademicGuard reverse proxy configuration
# Section 4.3: SSL termination, static file serving, rate limiting
# NFR-SEC-03: HTTPS only; HSTS header; TLS 1.2 minimum
# NFR-SEC-06: Rate limiting — 10 req/min on auth routes

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Rate limiting zones (NFR-SEC-06) ────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=auth:10m    rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m     rate=60r/m;
    limit_req_zone $binary_remote_addr zone=upload:10m  rate=5r/m;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile    on;
    gzip        on;
    gzip_types  text/plain text/css application/json application/javascript;

    # ── Upstream FastAPI ───────────────────────────────────────────────────────
    upstream api {
        server api:8000;
        # Add more workers for horizontal scaling:
        # server api2:8000;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS server ──────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name academicguard.example.com;

        # TLS configuration (NFR-SEC-03)
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # HSTS (max-age=1 year) — NFR-SEC-03
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Security headers
        add_header X-Frame-Options           "DENY"            always;
        add_header X-Content-Type-Options    "nosniff"         always;
        add_header Referrer-Policy           "strict-origin"   always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self' cdn.jsdelivr.net; style-src 'self' cdn.jsdelivr.net; font-src 'self' cdn.jsdelivr.net;" always;

        # Upload size limit (FR-UPLOAD-01: max 200 MB total batch)
        client_max_body_size 200M;

        # ── Static frontend files ─────────────────────────────────────────────
        location / {
            root  /usr/share/nginx/html;
            index pages/login.html;
            try_files $uri $uri/ /pages/login.html;
        }

        # ── Auth endpoints — strict rate limiting ─────────────────────────────
        location /api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass         http://api;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto https;
        }

        # ── Batch upload — separate rate zone ────────────────────────────────
        location /api/v1/batches/upload {
            limit_req zone=upload burst=3 nodelay;
            proxy_pass         http://api;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_read_timeout 300s;   # Allow time for large uploads
        }

        # ── General API ───────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass         http://api;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-For   $remote_addr;
            proxy_set_header   X-Forwarded-Proto https;
        }
    }
}
