[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:postgres]
command=postgres -D /var/lib/postgresql/data/pg_data
user=postgres
autostart=true
autorestart=true
stderr_logfile=/var/log/postgres.err.log
stdout_logfile=/var/log/postgres.out.log

[program:redis]
command=redis-server
autostart=true
autorestart=true
stderr_logfile=/var/log/redis.err.log
stdout_logfile=/var/log/redis.out.log

[program:api]
command=uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
directory=/app/backend
user=root
autostart=true
autorestart=true
environment=DATABASE_URL="%(ENV_DATABASE_URL)s",JWT_SECRET_KEY="%(ENV_JWT_SECRET_KEY)s",FRONTEND_ORIGIN="%(ENV_FRONTEND_ORIGIN)s"
stderr_logfile=/var/log/api.err.log
stdout_logfile=/var/log/api.out.log
startsecs=3

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/nginx.err.log
stdout_logfile=/var/log/nginx.out.log
