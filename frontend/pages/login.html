<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Sign in to AcademicGuard | AI-powered academic integrity analysis for instructors."/>
  <title>Login | AcademicGuard</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/icons.css">
    <link rel="stylesheet" href="/css/main.css"/>
  <script>
    (function() {
      const t = localStorage.getItem('ag-theme') || localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.setAttribute('data-bs-theme', t);
    })();
  </script>
  <style>
    body {
      background: var(--ag-bg);
      background-image: 
        radial-gradient(at 0% 0%, hsla(var(--ag-primary-hsl), 0.1) 0px, transparent 50%),
        radial-gradient(at 100% 0%, hsla(var(--ag-primary-hsl), 0.05) 0px, transparent 50%),
        radial-gradient(at 100% 100%, hsla(var(--ag-primary-hsl), 0.1) 0px, transparent 50%),
        radial-gradient(at 0% 100%, hsla(var(--ag-primary-hsl), 0.05) 0px, transparent 50%);
      background-attachment: fixed;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
      padding: 1.5rem;
    }
    .auth-card {
      background: var(--ag-card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--ag-border);
      box-shadow: var(--ag-shadow-lg);
      border-radius: 1.25rem;
      padding: 2.5rem;
    }
    .auth-footer {
      margin-top: 2rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--ag-border);
    }
  </style>
</head>
<body data-page="login" class="d-flex align-items-center justify-content-center" style="min-height:100vh">

<div class="login-container animate-fade-in">
  <div class="auth-card">
    <div class="text-center mb-5">
      <div class="mb-3 d-inline-block p-3 rounded-4" style="background: var(--ag-primary-soft)">
        <i class="ag-icon ag-shield-lock text-primary display-5"></i>
      </div>
      <h3 class="fw-bold mb-1" style="color: var(--ag-text); font-family: 'Outfit', sans-serif">AcademicGuard</h3>
      <p class="small" style="color: var(--ag-text-muted)">Sign in to your instructor account</p>
    </div>

    <!-- FR-AUTH-02 Login form -->
    <form id="login-form" novalidate>
      <div id="alert-container"></div>

      <div class="mb-4">
        <label for="email" class="form-label small fw-bold" style="color:var(--ag-text-muted)">INSTITUTIONAL EMAIL</label>
        <div class="input-group">
          <span class="input-group-text border-end-0"><i class="ag-icon ag-envelope" style="color:var(--ag-text-muted)"></i></span>
          <input type="email" class="form-control border-start-0" id="email"
                placeholder="instructor@uits.edu.bd" required autocomplete="email"/>
          <div class="invalid-feedback">Please enter a valid institutional email.</div>
        </div>
      </div>

      <div class="mb-5">
        <label for="password" class="form-label small fw-bold" style="color:var(--ag-text-muted)">PASSWORD</label>
        <div class="input-group">
          <span class="input-group-text border-end-0"><i class="ag-icon ag-key" style="color:var(--ag-text-muted)"></i></span>
          <input type="password" class="form-control border-start-0" id="password"
                placeholder="••••••••" required autocomplete="current-password"/>
          <div class="invalid-feedback">Password is required.</div>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-3 mb-3 rounded-3 d-flex align-items-center justify-content-center gap-2" id="submit-btn">
        <span>Sign In</span>
        <i class="ag-icon ag-arrow-right"></i>
      </button>
    </form>

    <div class="auth-footer text-center">
      <p class="small mb-0" style="color:var(--ag-text-muted)">
        New investigator?
        <a href="/pages/register.html" class="text-primary fw-bold text-decoration-none">Create an account</a>
      </p>
    </div>
  </div>

  <p class="text-center mt-4 x-small" style="color:var(--ag-text-muted)">
    <i class="ag-icon ag-lock-fill me-1"></i> Secured with end-to-end encryption
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
