    <path d="M12 12v9"/>
    <path d="m16 16-4-4-4 4"/>
  </symbol>

  <!-- 4. Document / Originality Report -->
  <symbol id="ag-document" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
