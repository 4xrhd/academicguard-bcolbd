<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <!-- AcademicGuard Cohesive Icon System (24x24 grid, 2px stroke, 2px radius, optical alignment) -->

  <!-- 1. Brand Shield Check -->
  <symbol id="ag-shield-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    <path d="m9 12 2 2 4-4"/>
  </symbol>

  <!-- 2. Dashboard Grid -->
  <symbol id="ag-dashboard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="7" height="7" rx="2"/>
    <rect x="14" y="3" width="7" height="7" rx="2"/>
    <rect x="14" y="14" width="7" height="7" rx="2"/>
    <rect x="3" y="14" width="7" height="7" rx="2"/>
  </symbol>

  <!-- 3. Upload Cloud -->
  <symbol id="ag-upload-cloud" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
