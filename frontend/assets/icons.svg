    <polyline points="12 5 19 12 12 19"/>
  </symbol>

  <!-- 17. Check Circle / Low Risk -->
  <symbol id="ag-check-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
